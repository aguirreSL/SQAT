# Nightly tests of this fork: brings in the main of ggrecow/SQAT, runs test/
# (sqat_report_build) and publishes the report of the run on GitHub Pages. When every test passes,
# the merge is pushed, so this main follows the upstream one with the tests on top.
name: tests

on:
  schedule:
    - cron: "0 3 * * *"        # every night, 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write                   # the report on https://aguirresl.github.io/SQAT/
  id-token: write

jobs:
  tests:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge the main of ggrecow/SQAT
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch https://github.com/ggrecow/SQAT.git main
          git merge --no-edit FETCH_HEAD

      - name: Download the test signals of ISO 532-1 (Annex B and C)
        run: |
          mkdir -p "test/reference/data/ISO 532-1 - Program etc"
          curl -sSfL -o /tmp/iso532-1.zip "https://standards.iso.org/iso/532/-1/ed-1/en/ISO%20532-1%20-%20Program%20etc.zip"
          unzip -q /tmp/iso532-1.zip -d "test/reference/data/ISO 532-1 - Program etc"
          ls "test/reference/data/ISO 532-1 - Program etc"

      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2026a
          products: Signal_Processing_Toolbox
          cache: true                  # MATLAB kept between runs

      - name: Run the tests and build the report
        uses: matlab-actions/run-command@v2
        with:
          command: |
            addpath('test/report'); assert(sqat_report_build, 'some tests failed: see the report')

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: test/report/out/

      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: test/report/out/

      - id: pages
        uses: actions/deploy-pages@v4
        if: always()

      - name: Push the merge
        run: git push origin HEAD:main
