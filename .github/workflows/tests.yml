# Nightly tests of this fork: brings in the main of ggrecow/SQAT and the GUI
# (feat/sqat-gui of this fork), runs test/
# (sqat_report_build) and publishes the report of the run on GitHub Pages. When every test passes,
# the merge is pushed, so this main follows the upstream one with the tests on top.
name: tests

on:
  schedule:
    - cron: "0 3 * * *"        # every night, 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write                   # the report on https://aguirresl.github.io/SQAT/
  id-token: write

jobs:
  tests:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge the main of ggrecow/SQAT and the GUI branch of this fork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch https://github.com/ggrecow/SQAT.git main
          git merge --no-edit FETCH_HEAD
          git fetch origin feat/sqat-gui
          git merge --no-edit FETCH_HEAD

      - name: Download the test signals of ISO 532-1 (Annex B and C)
        run: |
          mkdir -p "test/reference/data/ISO 532-1 - Program etc"
          curl -sSfL -o /tmp/iso532-1.zip "https://standards.iso.org/iso/532/-1/ed-1/en/ISO%20532-1%20-%20Program%20etc.zip"
          unzip -q /tmp/iso532-1.zip -d "test/reference/data/ISO 532-1 - Program etc"
          ls "test/reference/data/ISO 532-1 - Program etc"

      - name: Cache the validation sounds of SQAT v1.0 (Zenodo 7933206)
        id: zenodo
        uses: actions/cache@v4
        with:
          path: sound_files/validation_SQAT_v1_0
          key: zenodo-7933206

      - name: Download the validation sounds of SQAT v1.0
        if: steps.zenodo.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o /tmp/zenodo.zip "https://zenodo.org/records/7933206/files/validation_SQAT_v1_0.zip?download=1"
          mkdir -p /tmp/zenodo
          unzip -q /tmp/zenodo.zip -d /tmp/zenodo
          src=/tmp/zenodo; [ -d /tmp/zenodo/validation_SQAT_v1_0 ] && src=/tmp/zenodo/validation_SQAT_v1_0
          mkdir -p sound_files/validation_SQAT_v1_0
          cp -R "$src"/. sound_files/validation_SQAT_v1_0/
          ls sound_files/validation_SQAT_v1_0

      # a virtual display and audio output, so that the playback and the enhanced
      # spectrogram tests of the GUI run here too (only the end of a file needs
      # an output that plays in real time, which this one does not: that test skips)
      - name: Virtual display and audio output
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb pulseaudio pulseaudio-utils libasound2-plugins
          Xvfb :99 -screen 0 1920x1080x24 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          printf 'pcm.!default { type pulse }\nctl.!default { type pulse }\n' > ~/.asoundrc
          pulseaudio -D --exit-idle-time=-1
          sleep 2
          pactl load-module module-null-sink sink_name=ci
          pactl set-default-sink ci

      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2026a
          products: Signal_Processing_Toolbox
          cache: true                  # MATLAB kept between runs

      - name: Run the tests and build the report
        timeout-minutes: 60           # about 30 min of tests, with the GUI ones that need a display
        uses: matlab-actions/run-command@v2
        with:
          command: |
            addpath('test/report'); assert(sqat_report_build, 'some tests failed: see the report')

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: test/report/out/

      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: test/report/out/

      - id: pages
        uses: actions/deploy-pages@v4
        if: always()

      - name: Push the merge
        run: git push origin HEAD:main
